<style>

.x{all:unset;position:absolute;right:12px;top:8px;cursor:pointer;color:var(--mut);font-size:20px}

</style></head><body>
<canvas id="c"></canvas>

 <div class="ttl glass"><h1>Obunachilar arxipelagi</h1><p>Har bir obunachi — oʻz oroli</p></div>

 <div class="bd">
  <div class="row" id="rw"><span class="at">@</span><input id="nm" placeholder="instagram_nomingiz" maxlength="30" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></div>
  <div class="chips" id="chips"></div>

 </div>
</section>

{const n=700,a=new Float32Array(n*3);for(let i=0;i<n;i++){const u=Math.random()*6.283,v=Math.acos(Math.random()*.9+.1),r=380;a[i*3]=r*Math.sin(v)*Math.cos(u);a[i*3+1]=r*Math.cos(v);a[i*3+2]=r*Math.sin(v)*Math.sin(u)}

 return g}

 const w=Math.min(304,x.measureText(t).width+34);x.fillStyle=own?'rgba(255,213,74,.95)':'rgba(8,20,42,.82)';x.strokeStyle=own?'#fff':'rgba(150,210,255,.6)';x.lineWidth=3;

// ishga tushirish
const seen=new Set();
function render(){const t=now();for(const o of isl){S.remove(o.g);o.br&&S.remove(o.br);o.g.traverse(m=>{if(m.isSprite){m.material.map&&m.material.map.dispose();m.material.dispose()}})}
 isl.length=0;picks.length=0;me=null;
 addIsland('ustoz ai',2,true,seen.has('hub')?-9:t+.3,true,'hub');seen.add('hub');
 users.slice().sort((a,b)=>a.t-b.t).forEach(u=>{const o=addIsland(u.name,u.type,u.id==UID,seen.has(u.id)?-9:t+.2,false,u.id,BO[u.id]);seen.add(u.id);if(u.id==UID)me=o});
 selO=selId&&isl.find(o=>o.id==selId)||null;if(selO)adm();else $('#card').hidden=true;ui()}
function adm(){const a=$('#ad');a.innerHTML='';const o=selO;if(!ADMIN||!OPEN||!o||$('#card').hidden)return;
 const bt=(t,f)=>{const b=document.createElement('button');b.className='ab';b.textContent=t;b.onclick=f;a.append(b)},er=()=>toast('Saqlab boʻlmadi');
 if(o.hub){bt('➕ Kattaroq',()=>cfgSet({hub:clamp(+(cfg.hub+.4).toFixed(1),2,6)}));bt('➖ Kichikroq',()=>cfgSet({hub:clamp(+(cfg.hub-.4).toFixed(1),2,6)}));return}
 const set=p=>DB.doc('boosts/'+o.id).set({sc:clamp(+(p.sc==null?o.sc:p.sc).toFixed(2),.6,2.2),glow:p.glow==null?o.gl:p.glow}).catch(er);
 bt('➕ Kattaroq',()=>set({sc:o.sc+.3}));bt('➖ Kichikroq',()=>set({sc:o.sc-.3}));bt(o.gl?'✨ Yorqinni oʻchirish':'✨ Yorqin qilish',()=>set({glow:!o.gl}));
 bt('🗑 Oʻchirish',()=>DB.doc('islands/'+o.id).delete().then(()=>{DB.doc('boosts/'+o.id).delete().catch(()=>{});selId=null}).catch(()=>toast('Oʻchirib boʻlmadi')))}
function cfgSet(p){if(DB)DB.doc('config/main').set({hub:cfg.hub,goal:cfg.goal,...p}).catch(()=>toast('Saqlab boʻlmadi'))}
function adminUI(){$('#ab').hidden=!ADMIN;$('#hs').value=cfg.hub;$('#gl').value=cfg.goal||''}
$('#ab').onclick=()=>$('#adm').classList.toggle('on');
$('#pb').onclick=async()=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode($('#pw').value.trim().toLowerCase()));const h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');if(h==='453d5f86f68c151ca103a924f1d50850830c7ca7eb079c100dc00f7f680896c3'){OPEN=true;$('#lk').hidden=true;$('#ac').hidden=false;$('#pw').value='';adm();toast('Admin ochildi ✅')}else toast('Parol notoʻgʻri')}catch(e){toast('Tekshirib boʻlmadi')}};$('#pw').onkeydown=e=>e.key=='Enter'&&$('#pb').click();$('#hs').onchange=e=>cfgSet({hub:clamp(+e.target.value,2,6)});
$('#gs').onclick=()=>{cfgSet({goal:Math.max(0,Math.floor(+$('#gl').value||0))});toast('Maqsad saqlandi')};
try{const s=JSON.parse(localStorage.getItem('arx')||'null');if(s&&/^[a-z0-9._]{2,30}$/.test(s.n))users.push({id:UID,name:s.n,type:s.t&3,t:1})}catch(e){}
render();
(async()=>{try{if(!window.claude)return;const[db,us]=await Promise.all([claude.use('db'),claude.use('user')]);const id=us&&await us.id();if(!db||!id)return;DB=db;UID=id;users=[];ADMIN=!!((await us.canEdit())||(await us.isOwner()));adminUI();
 DB.collection('islands').onSnapshot(s=>{users=s.docs.map(d=>{const x=d.data()||{};return{id:d.id,name:String(x.name||''),type:(x.type|0)&3,t:+x.t||0}}).filter(u=>/^[a-z0-9._]{2,30}$/.test(u.name));render()},()=>{});
 DB.collection('boosts').onSnapshot(s=>{BO={};s.docs.forEach(d=>BO[d.id]=d.data());render()},()=>{});
 DB.doc('config/main').onSnapshot(s=>{const d=s.data();if(d){cfg.hub=clamp(+d.hub||3.4,2,6);cfg.goal=Math.max(0,+d.goal||0)}adminUI();render()},()=>{})}catch(e){}})();
setTimeout(()=>$('#hint').style.opacity=0,7000);
// animatsiya
function loop(){requestAnimationFrame(loop);const t=now();
 if(t-idle>4&&!P.size)T.th+=.0007;
 for(const k of['th','ph','d','x','z'])C[k]+=(T[k]-C[k])*.07;
 cam.position.set(C.x+C.d*Math.sin(C.ph)*Math.cos(C.th),C.d*Math.cos(C.ph),C.z+C.d*Math.sin(C.ph)*Math.sin(C.th));cam.lookAt(C.x,0,C.z);
 isl.forEach((o,i)=>{const k=clamp((t-o.born)/1.1,0,1),e=k<1?1+2.70158*Math.pow(k-1,3)+1.70158*Math.pow(k-1,2):1;o.g.scale.setScalar(Math.max(.001,e*o.sc));o.g.position.y=Math.sin(t*.8+i)*.08});
 ringMat.opacity=.13+.07*Math.sin(t*1.6);R.render(S,cam)}
loop();
</script></body></html>
